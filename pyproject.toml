[project]
name = "jg-plugin-conversational"
version = "1.0.0"
description = "Plugin conversacional (clima y noticias RSS) para jg_agente"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Javier Gálvez" }]
dependencies = [
    "jg-agente-sdk>=1.0.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[project.entry-points."jg_agente.plugins"]
conversational = "jg_plugin_conversational.plugin:ConversationalPlugin"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jg_plugin_conversational*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "dist",
    "build",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]
